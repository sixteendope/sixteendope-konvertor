<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="конвертер">
<title>конвертер</title>
<style>
:root{--bg:#fff;--card:#f2f2f2;--tx:#000;--tx2:#8a8a8a;--seg:#ececec;--thumb:#000;--thumbtx:#fff;--ink:#000;--paper:#fff;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--card:#1c1c1c;--tx:#fff;--tx2:#98989f;--seg:#1c1c1c;--thumb:#fff;--thumbtx:#000;--ink:#fff;--paper:#000}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1c;--tx:#fff;--tx2:#98989f;--seg:#1c1c1c;--thumb:#fff;--thumbtx:#000;--ink:#fff;--paper:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:12px 4px 18px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--seg);border-radius:12px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--tx);font-size:15px;font-weight:600;font-family:inherit;padding:9px 0;cursor:pointer}
.seg button.on{color:var(--thumbtx)}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--thumb);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.inp{cursor:pointer;margin-top:16px;background:var(--card);border-radius:20px;padding:18px 20px;display:flex;align-items:baseline;gap:10px}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font-size:44px;font-weight:700;font-family:inherit;letter-spacing:-1px}
.inp span{font-size:22px;font-weight:600;color:var(--tx2)}
.res{margin-top:14px;display:grid;gap:12px}
.res:not(:empty){height:292px;grid-template-rows:1fr 1fr}
.c{position:relative;overflow:hidden;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--ink);color:var(--paper);animation:in .6s cubic-bezier(.34,1.56,.64,1) both,glow 1.6s ease-out both}
.c:nth-child(2){animation-delay:.08s}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
.c .t{display:flex;gap:8px;font-size:13px;font-weight:600;opacity:.85}
.c .n{font-size:34px;font-weight:700;letter-spacing:-1px;margin:4px 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--paper) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--paper);border-radius:4px;transition:width .7s cubic-bezier(.34,1.3,.64,1)}
.c .r{margin-top:0;font-size:13px;opacity:.8}
html,body,button,.inp{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
::view-transition-old(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s cubic-bezier(.65,0,.35,1) both;mix-blend-mode:normal}
@keyframes reveal{from{clip-path:circle(0 at var(--x,90%) var(--y,10%))}to{clip-path:circle(150% at var(--x,90%) var(--y,10%))}}
.l{min-width:0;flex:1}
.c .t span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c .t span:last-child{flex:none}
.g{width:130px;flex:none}
.d{font-size:13px;font-weight:600;opacity:.9;margin-bottom:4px;text-align:right;white-space:nowrap}
.ch{display:block;width:100%;height:auto;overflow:visible}
.ch polyline{fill:none;stroke:var(--paper);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .25s ease-out forwards}
.ch circle{fill:var(--paper);opacity:0;animation:fade .3s 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center}
#tg{width:44px;height:44px;border-radius:50%;border:0;background:var(--seg);color:var(--tx);font-size:22px;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#tg:active{transform:scale(.88) rotate(90deg)}
.pad{animation:in .45s cubic-bezier(.34,1.56,.64,1) both;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@keyframes out{to{opacity:0;transform:translateY(18px) scale(.96)}}
.out{animation:out .28s ease-in both!important}
.c.out:nth-child(2){animation-delay:.05s!important}
.pad .ok{grid-column:1/-1;background:var(--ink);color:var(--paper);font-size:18px;font-weight:600;height:0;margin-top:-8px;opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;overflow:hidden;transition:height .45s cubic-bezier(.34,1.4,.64,1),margin .45s cubic-bezier(.34,1.4,.64,1),opacity .3s ease,transform .45s cubic-bezier(.34,1.4,.64,1)}
.pad .ok.show{height:52px;margin-top:0;opacity:1;transform:none;pointer-events:auto}
.pad .ok.show:active{transform:scale(.96)}
.pad button{height:52px;border:0;border-radius:14px;background:var(--card);color:var(--tx);font-size:24px;font-weight:500;font-family:inherit;cursor:pointer;transition:transform .15s,background .15s}
.pad button:active{transform:scale(.94);background:var(--seg)}
@keyframes glow{0%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 50px 10px color-mix(in srgb,var(--ink) 40%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.c.sx .l,.c.sx .g{opacity:0;transform:translateY(-6px);transition:opacity .15s ease,transform .15s ease}
.c.sw .l,.c.sw .g{animation:fi .45s cubic-bezier(.34,1.3,.64,1) both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.nf{animation:nf .3s ease}
@keyframes nf{from{opacity:0}}
.note{margin:18px 6px 0;font-size:13px;color:var(--tx2);text-align:center}
</style>
</head>
<body>
<main>
<div class="top"><h1>конвертер</h1><button id="tg" aria-label="тема">◐</button></div>
<div class="seg" id="seg"><div class="thumb" id="thumb"></div>
<button data-c="BYN">BYN</button><button data-c="USD">USD</button><button data-c="RUB">RUB</button></div>
<div class="inp"><input id="amt" type="text" inputmode="none" readonly placeholder="0" autocomplete="off"><span id="cur">BYN</span></div>
<div class="res" id="res"></div>
<div class="pad" id="pad"></div>
<p class="note" id="note">sixteendope ©</p>
</main>
<script>
// курс в BYN за 1 единицу. запасной, если живой не загрузился
var rates={BYN:1,USD:3.0,RUB:0.037};
var grad={BYN:["#34c759","#00a86b"],USD:["#5ac8fa","#007aff"],RUB:["#ff9f0a","#ff375f"]};
var names={BYN:"белорусский рубль",USD:"доллар сша",RUB:"российский рубль"};
var cur="BYN",shown={};
var seg=document.getElementById("seg"),thumb=document.getElementById("thumb"),amt=document.getElementById("amt");
var order=["BYN","USD","RUB"];

function fmt(v){return v.toLocaleString("ru-RU",{maximumFractionDigits:v<1?4:2,minimumFractionDigits:2})}
function num(){return parseFloat(amt.value.replace(/\s/g,"").replace(",","."))||0}

function render(){
  document.getElementById("cur").textContent=cur;fitIn();
  thumb.style.transform="translateX("+order.indexOf(cur)*100+"%)";
  [].forEach.call(seg.querySelectorAll("button"),function(b){b.classList.toggle("on",b.dataset.c===cur)});
  var base=num()*rates[cur];
  var okb=document.querySelector(".pad .ok");if(okb)okb.classList.toggle("show",num()>0);
  if(!num()||mode!=="result"){var b0=document.getElementById("res");b0.innerHTML="";b0.dataset.cur="";shown={};return}
  var html="";
  order.filter(function(c){return c!==cur}).forEach(function(c){
    var v=base/rates[c];
    html+='<div class="c"><div class="l"><div class="t"><span>'+names[c]+'</span><span>'+c+'</span></div><div class="n" data-c="'+c+'" data-v="'+v+'">'+fmt(shown[c]||0)+'</div><div class="r">1 '+cur+' = '+fmt(rates[cur]/rates[c])+' '+c+'</div></div>'+chart(c)+'</div>';
  });
  var box=document.getElementById("res");
  if(!box.children.length){box.innerHTML=html;box.dataset.cur=cur}
  else if(box.dataset.cur!==cur){morph(box,html);return}
  else{[].forEach.call(box.children,function(el,i){el.querySelector(".r").textContent=(html.match(/class="r">([^<]*)/g)[i]||"").replace('class="r">','')})}
  [].forEach.call(box.querySelectorAll(".n"),function(el){
    var c=el.dataset.c,to=base/rates[c],from=shown[c]||0,t0=performance.now();
    el.dataset.v=to;
    (function step(t){var p=Math.min(1,(t-t0)/450),e=1-Math.pow(1-p,3);shown[c]=from+(to-from)*e;el.textContent=fmt(shown[c]);fit(el);if(p<1)requestAnimationFrame(step)})(t0);
  });
  var vals=[].map.call(box.querySelectorAll(".n"),function(el){return +el.dataset.v});
  var mx=Math.max.apply(null,vals.concat([1e-9]));
  [].forEach.call(box.querySelectorAll(".bar i"),function(b,i){requestAnimationFrame(function(){b.style.width=Math.max(4,vals[i]/mx*100)+"%"})});
}

seg.addEventListener("click",function(e){var c=e.target.dataset&&e.target.dataset.c;if(c&&c!==cur){cur=c;shown={};render();haptic()}});
amt.addEventListener("input",render);

var hist=null,ids={USD:431,RUB:456},sc={USD:1,RUB:100};
function ymd(d){return d.toISOString().slice(0,10)}
function fitIn(){var w=amt.parentNode.clientWidth-40-10-document.getElementById("cur").offsetWidth,n=Math.max(1,amt.value.length);amt.style.fontSize=Math.max(20,Math.min(44,Math.floor(w/(n*.68))))+"px"}
function fit(el){var c=el.closest(".c");if(!c)return;var av=c.clientWidth-190,n=el.textContent.length;el.style.fontSize=Math.max(16,Math.min(34,Math.floor(av/(n*.56))))+"px"}
function chart(c){
  if(!hist)return"";
  var s=hist[cur].map(function(v,i){return v/hist[c][i]}),n=s.length;
  var mn=Math.min.apply(null,s),mx=Math.max.apply(null,s);
  var pts=s.map(function(v,i){return [4+i*122/(n-1),mx===mn?30:52-(v-mn)/(mx-mn)*44]});
  var p=pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
  var ch=(s[n-1]/s[n-2]-1)*100,lt=pts[n-1];
  var txt=Math.abs(ch)<0.005?"без изменений":(ch>0?"▲ ":"▼ ")+Math.abs(ch).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:2})+"% к вчера";
  return '<div class="g"><div class="d">'+txt+'</div><svg class="ch" viewBox="0 0 130 60"><polyline pathLength="1" points="'+p+'"/><circle cx="'+lt[0].toFixed(1)+'" cy="'+lt[1].toFixed(1)+'" r="3.5"/></svg></div>';
}
function loadHist(){
  var now=Date.now()+3*36e5,end=ymd(new Date(now)),start=ymd(new Date(now-9*864e5));
  Promise.all(["USD","RUB"].map(function(c){
    return fetch("https://api.nbrb.by/exrates/rates/dynamics/"+ids[c]+"?startDate="+start+"&endDate="+end).then(function(r){return r.json()}).then(function(a){var m={};a.forEach(function(x){m[x.Date.slice(0,10)]=x.Cur_OfficialRate/sc[c]});return m});
  })).then(function(r){
    var days=Object.keys(r[0]).filter(function(d){return r[1][d]!==undefined}).sort().slice(-7);
    if(days.length<2)return;
    hist={BYN:days.map(function(){return 1}),USD:days.map(function(d){return r[0][d]}),RUB:days.map(function(d){return r[1][d]})};
    document.getElementById("res").dataset.cur="";render();
  }).catch(function(){});
}
function loadRates(){
  fetch("https://api.nbrb.by/exrates/rates?periodicity=0").then(function(r){return r.json()}).then(function(d){
    d.forEach(function(x){if(x.Cur_Abbreviation==="USD"||x.Cur_Abbreviation==="RUB"){var k=x.Cur_Abbreviation;rates[k]=x.Cur_OfficialRate/x.Cur_Scale;ids[k]=x.Cur_ID;sc[k]=x.Cur_Scale}});loadHist();
    render();
  }).catch(function(){render()});
}
var pad=document.getElementById("pad");
["1","2","3","4","5","6","7","8","9",",","0","⌫"].forEach(function(k){var b=document.createElement("button");b.textContent=k;b.onclick=function(){key(k)};pad.appendChild(b)});
var ok=document.createElement("button");ok.textContent="ок";ok.className="ok";ok.onclick=function(){if(num()>0){haptic();setMode("result")}};pad.appendChild(ok);
var mode="edit";
var busy=0;
function setMode(m){
  if(busy||m===mode)return;
  var box=document.getElementById("res");busy=1;
  if(m==="edit"){
    [].forEach.call(box.children,function(c){c.classList.add("out")});
    setTimeout(function(){busy=0;mode="edit";shown={};render();pad.style.display="grid"},320);
  }else{
    pad.classList.add("out");
    setTimeout(function(){busy=0;pad.classList.remove("out");pad.style.display="none";mode="result";shown={};render()},280);
  }
}
document.querySelector(".inp").onclick=function(){if(mode!=="edit"){haptic();setMode("edit")}};
function key(k){var v=amt.value;if(k==="⌫")v=v.slice(0,-1);else if(k===","){if(v.indexOf(",")<0)v=(v||"0")+","}else{if(v==="0")v="";if(v.length<12)v+=k}amt.value=v;render();haptic()}
var root=document.documentElement;
function isDark(){var t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
try{var s=localStorage.getItem("th");if(s)root.dataset.theme=s}catch(e){}
document.getElementById("tg").onclick=function(){var t=isDark()?"light":"dark";haptic();function set(){root.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}}var b=document.getElementById("tg").getBoundingClientRect();root.style.setProperty("--x",(b.left+b.width/2)+"px");root.style.setProperty("--y",(b.top+b.height/2)+"px");set()};
document.addEventListener("gesturestart",function(e){e.preventDefault()});
document.addEventListener("dblclick",function(e){e.preventDefault()});
var hl=document.createElement("label");hl.style.cssText="position:fixed;left:-99px;top:0;opacity:0;pointer-events:none";
var hi=document.createElement("input");hi.type="checkbox";hi.setAttribute("switch","");hl.appendChild(hi);document.body.appendChild(hl);
function haptic(){try{if(navigator.vibrate){navigator.vibrate(8);return}hl.click()}catch(e){}}
var mtok=0;
function morph(box,html){
  var tk=++mtok;box.dataset.cur=cur;
  [].forEach.call(box.children,function(el){el.classList.remove("sw");el.classList.add("sx")});
  setTimeout(function(){
    if(tk!==mtok)return;
    var tmp=document.createElement("div");tmp.innerHTML=html;
    [].forEach.call(box.children,function(el,i){
      var nw=tmp.children[i];if(!nw)return;
      var o=el.querySelector(".n");
      shown[nw.querySelector(".n").dataset.c]=o?+o.dataset.v:0;
      el.innerHTML=nw.innerHTML;el.classList.remove("sx");void el.offsetWidth;el.classList.add("sw");
    });
    render();
  },160);
}
var hc=null,hs=0,nt=null,note=document.getElementById("note");
function flash(){
  note.textContent="скопировано";note.classList.remove("nf");void note.offsetWidth;note.classList.add("nf");
  
  clearTimeout(nt);
  nt=setTimeout(function(){note.textContent="sixteendope \u00a9";note.classList.remove("nf");void note.offsetWidth;note.classList.add("nf")},1800);
}
function copyTxt(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0;-webkit-user-select:text;user-select:text";document.body.appendChild(a);a.select();a.setSelectionRange(0,99);try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);flash()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(flash,fb)}else{fb()}
}
var resEl=document.getElementById("res");
resEl.addEventListener("pointerdown",function(e){hc=e.target.closest(".c");hs=Date.now()});
resEl.addEventListener("pointerup",function(){
  if(hc&&Date.now()-hs>=450){var n=hc.querySelector(".n");if(n){haptic();var v=+n.dataset.v;copyTxt(v.toLocaleString("ru-RU",{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:v<1?4:2}))}}
  hc=null;
});
resEl.addEventListener("pointercancel",function(){hc=null});
render();loadRates();
</script>
</body>
</html>
